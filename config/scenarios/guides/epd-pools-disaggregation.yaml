# EPD POOLS DISAGGREGATION WELL LIT PATH
#
# Three independent single-vLLM pools, each with its own EPP, InferencePool,
# and HTTPRoute. Modeled after pd-disaggregation but with the prefill+decode
# pair replaced by three peer pools labeled encode / prefill / decode.
#
# Topology:
#                        +---- Gateway (infra-llmdbench, shared) ------+
#                        |     HTTPRoute encode  -> InferencePool A    |
#                        |     HTTPRoute prefill -> InferencePool B    |
#                        |     HTTPRoute decode  -> InferencePool C    |
#                        +---------------------------------------------+
#                              |              |              |
#                      +-------+------+ +-----+------+ +-----+------+
#                      | EPP encode   | | EPP prefill| | EPP decode |
#                      | + Pool       | | + Pool     | | + Pool     |
#                      +-------+------+ +-----+------+ +-----+------+
#                              |              |              |
#                      +-------+------+ +-----+------+ +-----+------+
#                      | vLLM (encode)| | vLLM(pref) | | vLLM(dec)  |
#                      | role=encode  | | role=prefill| | role=decode|
#                      +--------------+ +------------+ +------------+
#
# Notes:
# - Uses a vendored fork of llm-d-modelservice at
#   `build/charts/llm-d-modelservice-epd` that adds an `encode` role
#   (encode-deployment.yaml + encodelabels helper) so the encode pod
#   gets a real `llm-d.ai/role: encode` label, not a fallback decode.
#   The fork is referenced via `modelservice.chartPath` (resolved against
#   the repo root by render_plans).
# - Each stack enables exactly one of {encode, prefill, decode}; the other
#   two are disabled via the shared block. The chart only renders the
#   Deployment whose `*.create` is true.
# - Stacks differ via role-suffixed `model.name`. The renderer derives
#   `model_id_label` from `model.name` + namespace, so distinct names yield
#   distinct InferencePools, EPPs, helm releases, and HTTPRoutes.
# - `model.path` and `model.huggingfaceId` are identical across stacks, so
#   the model is downloaded ONCE to a shared PVC and reused.
# - Each stack has its own `inferenceExtension.pluginsCustomConfig` so each
#   EPP gets a distinct EndpointPickerConfig (per task requirement).
# - HTTPRoutes are rendered in per-stack mode (default) - 3 separate
#   HTTPRoute objects, one per stack.

# ============================================================================
# SHARED -- applied to every stack BEFORE per-stack overrides
# ============================================================================
shared:
  # --------------------------------------------------------------------------
  # IMAGES -- overrides:
  #   * vllm / vllmOpenai      custom build with `--mm-encoder-only` and
  #                            Qwen3-VL multimodal support.
  #   * inferenceScheduler     custom EPP build (dima-pr branch) that
  #                            understands the EPP-Phase header and the
  #                            ECExampleConnector / ExampleConnector
  #                            pickers.
  # --------------------------------------------------------------------------
  images:
    vllm:
      repository: ghcr.io/revit13/vllm-openai
      tag: nightly-b50646e5effd7cb5884cd96fdff4c53c18521198.omer
    vllmOpenai:
      repository: ghcr.io/revit13/vllm-openai
      tag: nightly-b50646e5effd7cb5884cd96fdff4c53c18521198.omer
    inferenceScheduler:
      repository: ghcr.io/revit13/llm-d-router-endpoint-picker
      tag: dima-pr

  # --------------------------------------------------------------------------
  # DEPLOYMENT METHOD
  # --------------------------------------------------------------------------
  modelservice:
    enabled: true
    # Repo-relative path to the vendored chart fork (encode role added).
    # render_plans prepends `repoBaseDir` to relative paths so the helmfile
    # gets an absolute chart reference.
    chartPath: build/charts/llm-d-modelservice-epd

  standalone:
    enabled: false

  # --------------------------------------------------------------------------
  # ROLE GATING -- disable all three by default; each stack opts in to
  # exactly one. Without these, defaults.yaml would leave `decode.enabled:
  # true` everywhere and every stack would deploy a decode pod alongside
  # its actual role.
  # --------------------------------------------------------------------------
  decode:
    enabled: false
    replicas: 0
  prefill:
    enabled: false
    replicas: 0
  encode:
    enabled: false
    replicas: 0

  # --------------------------------------------------------------------------
  # ROUTING
  # --------------------------------------------------------------------------
  routing:
    connector: nixlv2

  # --------------------------------------------------------------------------
  # HTTP ROUTE -- single header-based router. The coordinator at
  # /home/eres/coordinator already sets `EPP-Phase: encode|prefill|decode`
  # on every outbound call (see pkg/gateway/paths.go); this mode renders
  # one HTTPRoute that fans out by that header to the matching pool.
  # Replaces the default per-stack path-prefix routes.
  # --------------------------------------------------------------------------
  httpRoute:
    mode: epp-phase
    # fallbackPhase: decode    # default; unheaded requests route to decode
    # name: epp-phase-router   # default

  # --------------------------------------------------------------------------
  # STORAGE -- two PVCs:
  #   * modelPvc        single shared model PVC. All three stacks load the
  #                     same weights from this volume; the per-stack
  #                     download Job is a no-op after the first stack
  #                     populates the path.
  #   * extraPvc        ReadWriteMany PVC backing /shared-cache for the
  #                     file-based EC + KV connectors (ECExampleConnector
  #                     ec_producer/consumer, ExampleConnector
  #                     kv_producer/consumer). All three pods (encode,
  #                     prefill, decode) bind-mount it via the
  #                     `shared-cache` entry in vllmCommon.volumes below.
  #                     Standup step 04 renders 16_pvc_extra-pvc.yaml from
  #                     this block and applies it before the helm releases
  #                     come up.
  # --------------------------------------------------------------------------
  storage:
    modelPvc:
      size: 1Ti
    extraPvc:
      name: vllm-shared-storage
      size: 50Gi
      # IBM Spectrum Scale fileset is the cluster default SC, RWX-capable,
      # and node-agnostic (the alternative `local-fs` binds to a specific
      # node and conflicts with GPU/RDMA scheduling).
      storageClassName: ibm-spectrum-scale-fileset
      accessModes:
        - ReadWriteMany

  # --------------------------------------------------------------------------
  # ANNOTATIONS / NETWORK RESOURCES (RDMA) -- carried over from
  # pd-disaggregation. Adjust or remove if the cluster lacks
  # `multi-nic-inference` NetworkAttachmentDefinition or `rdma/roce_gdr`.
  # --------------------------------------------------------------------------
  annotations:
    encode:
      pod:
        k8s.v1.cni.cncf.io/networks: multi-nic-inference
    prefill:
      pod:
        k8s.v1.cni.cncf.io/networks: multi-nic-inference
    decode:
      pod:
        k8s.v1.cni.cncf.io/networks: multi-nic-inference

    resources:
      encode:
        networkResource: "rdma/roce_gdr"
        networkNr: 1
      prefill:
        networkResource: "rdma/roce_gdr"
        networkNr: 1
      decode:
        networkResource: "rdma/roce_gdr"
        networkNr: 1

  # --------------------------------------------------------------------------
  # VLLM COMMON -- shared volumes/mounts across all three stacks
  # --------------------------------------------------------------------------
  vllmCommon:
    volumes:
      - name: shared-config
        type: emptyDir
        emptyDir: {}
      - name: dshm
        type: emptyDir
        emptyDir:
          medium: Memory
          sizeLimit: 16Gi
      # RWX PVC shared by all 3 roles for the file-based EC + KV connectors.
      # Apply /tmp/vllm-shared-storage.yaml manually before standup -- this
      # scenario assumes the PVC `vllm-shared-storage` already exists.
      - name: shared-cache
        type: persistentVolumeClaim
        persistentVolumeClaim:
          claimName: vllm-shared-storage

    volumeMounts:
      - name: shared-config
        mountPath: /shared-config
      - name: dshm
        mountPath: /dev/shm
      - name: shared-cache
        mountPath: /shared-cache

  # --------------------------------------------------------------------------
  # TIMEOUTS
  # --------------------------------------------------------------------------
  timeouts:
    controlWait: 900000
    harnessWait: 900000

  # --------------------------------------------------------------------------
  # WORKLOAD / HARNESS -- single-instance per scenario
  # --------------------------------------------------------------------------
  workDir: "~/data/epd-pools-disaggregation"

  harness:
    name: vllm-benchmark
    experimentProfile: random_concurrent.yaml


# ============================================================================
# SCENARIO -- three peer stacks, one per role
# ============================================================================
scenario:

  # ==========================================================================
  # Stack 1: ENCODE pool
  # ==========================================================================
  - name: epd-encode

    model:
      name: Qwen/Qwen3-VL-2B-Instruct-encode
      shortName: qwen-qwen3-vl-2b-instruct-encode
      path: models/Qwen/Qwen3-VL-2B-Instruct
      huggingfaceId: Qwen/Qwen3-VL-2B-Instruct
      size: 1Ti
      maxModelLen: 32768
      blockSize: 128
      gpuMemoryUtilization: 0.95
      cacheBase: /model-cache

    encode:
      enabled: true
      replicas: 1
      vllm:
        customCommand: |
          export LD_LIBRARY_PATH=$(find / -name libcuda.so.1 -printf '%h\n' 2>/dev/null | sed ':a; N; $!ba; s/\n/:/g'):${LD_LIBRARY_PATH}
          export LIBRARY_PATH=$(find / -name libcuda.so.1 -printf '%h\n' 2>/dev/null | head -1):${LIBRARY_PATH}
          source /shared-config/llmdbench_env.sh
          mkdir -p /shared-cache/ec /shared-cache/kv
          vllm serve /model-cache/$MODEL_PATH \
          --host 0.0.0.0 \
          --served-model-name $MODEL_NAME \
          --port $VLLM_INFERENCE_PORT \
          --block-size $VLLM_BLOCK_SIZE \
          --max-model-len $VLLM_MAX_MODEL_LEN \
          --max-num-seq $VLLM_MAX_NUM_SEQ \
          --max-num-batched-tokens $VLLM_MAX_NUM_BATCHED_TOKENS \
          --tensor-parallel-size $VLLM_TENSOR_PARALLELISM \
          --gpu-memory-utilization $VLLM_ACCELERATOR_MEM_UTIL \
          --ec-transfer-config '{"ec_connector":"ECExampleConnector","ec_role":"ec_producer","ec_connector_extra_config":{"shared_storage_path":"/shared-cache/ec"}}' \
          --disable-uvicorn-access-log \
          --disable-access-log-for-endpoints=/health,/metrics,/v1/models \
          --no-enable-prefix-caching \
          --mm-encoder-only \
          --dtype bfloat16 \
          --disable-hybrid-kv-cache-manager

      initContainers:
        - name: preprocess
          imageKey: benchmark
          imagePullPolicy: Always
          command: ["set_llmdbench_environment.py", "-e", "/shared-config/llmdbench_env.sh", "-i"]
          volumeMounts:
            - name: shared-config
              mountPath: /shared-config

      parallelism:
        tensor: 1
        data: 1
        dataLocal: 1
        workers: 1

      resources:
        limits:
          memory: 128Gi
          cpu: "32"
        requests:
          memory: 128Gi
          cpu: "32"

      extraEnvVars:
        - name: NCCL_EXCLUDE_IB_HCA
          value: "mlx5_0,mlx5_2,mlx5_4,mlx5_8,mlxl5_7,mlx5_10,mlx5_12,mlx5_14,mlx5_16"
        - name: NVSHMEM_DEBUG
          value: "INFO"

      extraContainerConfig:
        securityContext:
          capabilities:
            add:
              - "IPC_LOCK"
              - "SYS_RAWIO"
              - "NET_ADMIN"
              - "NET_RAW"
          runAsGroup: 0
          runAsUser: 0
        imagePullPolicy: Always

      additionalVolumeMounts: []
      additionalVolumes: []

    inferenceExtension:
      pluginsConfigFile: "epd-encode-config.yaml"
      pluginsCustomConfig:
        epd-encode-config.yaml: |
          apiVersion: inference.networking.x-k8s.io/v1alpha1
          kind: EndpointPickerConfig
          plugins:
          - type: prefix-cache-scorer
          - type: queue-scorer
          - type: kv-cache-utilization-scorer
          - type: max-score-picker
          schedulingProfiles:
          - name: default
            plugins:
            - pluginRef: prefix-cache-scorer
              weight: 3
            - pluginRef: queue-scorer
              weight: 2
            - pluginRef: kv-cache-utilization-scorer
              weight: 2
            - pluginRef: max-score-picker

  # ==========================================================================
  # Stack 2: PREFILL pool
  # ==========================================================================
  - name: epd-prefill

    model:
      name: Qwen/Qwen3-VL-2B-Instruct-prefill
      shortName: qwen-qwen3-vl-2b-instruct-prefill
      path: models/Qwen/Qwen3-VL-2B-Instruct
      huggingfaceId: Qwen/Qwen3-VL-2B-Instruct
      size: 1Ti
      maxModelLen: 32768
      blockSize: 128
      gpuMemoryUtilization: 0.95
      cacheBase: /model-cache

    prefill:
      enabled: true
      replicas: 1
      vllm:
        customCommand: |
          export LD_LIBRARY_PATH=$(find / -name libcuda.so.1 -printf '%h\n' 2>/dev/null | sed ':a; N; $!ba; s/\n/:/g'):${LD_LIBRARY_PATH}
          export LIBRARY_PATH=$(find / -name libcuda.so.1 -printf '%h\n' 2>/dev/null | head -1):${LIBRARY_PATH}
          source /shared-config/llmdbench_env.sh
          mkdir -p /shared-cache/ec /shared-cache/kv
          vllm serve /model-cache/$MODEL_PATH \
          --host 0.0.0.0 \
          --served-model-name $MODEL_NAME \
          --port $VLLM_INFERENCE_PORT \
          --block-size $VLLM_BLOCK_SIZE \
          --max-model-len $VLLM_MAX_MODEL_LEN \
          --max-num-seq $VLLM_MAX_NUM_SEQ \
          --max-num-batched-tokens $VLLM_MAX_NUM_BATCHED_TOKENS \
          --tensor-parallel-size $VLLM_TENSOR_PARALLELISM \
          --gpu-memory-utilization $VLLM_ACCELERATOR_MEM_UTIL \
          --kv-transfer-config '{"kv_connector":"ExampleConnector","kv_role":"kv_producer","kv_connector_extra_config":{"shared_storage_path":"/shared-cache/kv"}}' \
          --ec-transfer-config '{"ec_connector":"ECExampleConnector","ec_role":"ec_consumer","ec_connector_extra_config":{"shared_storage_path":"/shared-cache/ec"}}' \
          --disable-uvicorn-access-log \
          --disable-access-log-for-endpoints=/health,/metrics,/v1/models \
          --no-enable-prefix-caching \
          --dtype bfloat16 \
          --disable-hybrid-kv-cache-manager

      initContainers:
        - name: preprocess
          imageKey: benchmark
          imagePullPolicy: Always
          command: ["set_llmdbench_environment.py", "-e", "/shared-config/llmdbench_env.sh", "-i"]
          volumeMounts:
            - name: shared-config
              mountPath: /shared-config

      parallelism:
        tensor: 1
        data: 1
        dataLocal: 1
        workers: 1

      resources:
        limits:
          memory: 128Gi
          cpu: "32"
        requests:
          memory: 128Gi
          cpu: "32"

      extraEnvVars:
        - name: NCCL_EXCLUDE_IB_HCA
          value: "mlx5_0,mlx5_2,mlx5_4,mlx5_8,mlxl5_7,mlx5_10,mlx5_12,mlx5_14,mlx5_16"
        - name: NVSHMEM_DEBUG
          value: "INFO"

      extraContainerConfig:
        securityContext:
          capabilities:
            add:
              - "IPC_LOCK"
              - "SYS_RAWIO"
              - "NET_ADMIN"
              - "NET_RAW"
          runAsGroup: 0
          runAsUser: 0
        imagePullPolicy: Always

      additionalVolumeMounts: []
      additionalVolumes: []

    inferenceExtension:
      pluginsConfigFile: "epd-prefill-config.yaml"
      pluginsCustomConfig:
        epd-prefill-config.yaml: |
          apiVersion: inference.networking.x-k8s.io/v1alpha1
          kind: EndpointPickerConfig
          plugins:
          - type: prefix-cache-scorer
          - type: queue-scorer
          - type: kv-cache-utilization-scorer
          - type: max-score-picker
          schedulingProfiles:
          - name: default
            plugins:
            - pluginRef: prefix-cache-scorer
              weight: 3
            - pluginRef: queue-scorer
              weight: 2
            - pluginRef: kv-cache-utilization-scorer
              weight: 2
            - pluginRef: max-score-picker

  # ==========================================================================
  # Stack 3: DECODE pool
  # ==========================================================================
  - name: epd-decode

    model:
      name: Qwen/Qwen3-VL-2B-Instruct-decode
      shortName: qwen-qwen3-vl-2b-instruct-decode
      path: models/Qwen/Qwen3-VL-2B-Instruct
      huggingfaceId: Qwen/Qwen3-VL-2B-Instruct
      size: 1Ti
      maxModelLen: 32768
      blockSize: 128
      gpuMemoryUtilization: 0.95
      cacheBase: /model-cache

    decode:
      enabled: true
      replicas: 1
      vllm:
        customCommand: |
          export LD_LIBRARY_PATH=$(find / -name libcuda.so.1 -printf '%h\n' 2>/dev/null | sed ':a; N; $!ba; s/\n/:/g'):${LD_LIBRARY_PATH}
          export LIBRARY_PATH=$(find / -name libcuda.so.1 -printf '%h\n' 2>/dev/null | head -1):${LIBRARY_PATH}
          source /shared-config/llmdbench_env.sh
          mkdir -p /shared-cache/ec /shared-cache/kv
          vllm serve /model-cache/$MODEL_PATH \
          --host 0.0.0.0 \
          --served-model-name $MODEL_NAME \
          --port $VLLM_METRICS_PORT \
          --block-size $VLLM_BLOCK_SIZE \
          --max-model-len $VLLM_MAX_MODEL_LEN \
          --max-num-seq $VLLM_MAX_NUM_SEQ \
          --max-num-batched-tokens $VLLM_MAX_NUM_BATCHED_TOKENS \
          --tensor-parallel-size $VLLM_TENSOR_PARALLELISM \
          --gpu-memory-utilization $VLLM_ACCELERATOR_MEM_UTIL \
          --kv-transfer-config '{"kv_connector":"ExampleConnector","kv_role":"kv_consumer","kv_connector_extra_config":{"shared_storage_path":"/shared-cache/kv"}}' \
          --disable-uvicorn-access-log \
          --disable-access-log-for-endpoints=/health,/metrics,/v1/models \
          --no-enable-prefix-caching \
          --dtype bfloat16 \
          --disable-hybrid-kv-cache-manager

      initContainers:
        - name: preprocess
          imageKey: benchmark
          imagePullPolicy: Always
          command: ["set_llmdbench_environment.py", "-e", "/shared-config/llmdbench_env.sh", "-i"]
          volumeMounts:
            - name: shared-config
              mountPath: /shared-config

      parallelism:
        tensor: 1
        data: 1
        dataLocal: 1
        workers: 1

      resources:
        limits:
          memory: 128Gi
          cpu: "32"
        requests:
          memory: 128Gi
          cpu: "32"

      extraEnvVars:
